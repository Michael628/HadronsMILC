#Parameters for LMI running
shared_params:
  home: /workspaces/qcd-development/HadronsMILC/test
  logging_level: DEBUG
  mass:
    l: 0.01
    s: 0.4
    r: 0.1
  ens: "4444"
  lattice: [4, 4, 4, 4]
  time: 4
  space: 4
  runid: "LMI-RW-series-{series}-{eigs}-eigs-{noise}-noise"
  tstart: 0
  noise: 1
  tstop: 95
  dt: 1
  overwrite: false
  ext: ""
  blocksize: 384

contract_params:
  hardware: "cpu"
  diagram_params:
    g1g1:
      gamma_label: g1g1
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - G1_G1
      eig_range:
        min: 0
        max: 768
      outfile: contract
    test_tau:
      gamma_label: test_tau
      symmetric: True
      contraction_type: two_point
      mesons:
        - file: "meson"
          mass_original: "l"
          mass_updated: "r"
          evalfile: eval
        - file: "meson"
          mass_original: "l"
          mass_updated: "s"
          evalfile: eval
      gammas:
        - G5T_G5
      eig_range:
        min: 0
        max: 768
      outfile: contract
    all_onelink:
      gamma_label: all_onelink
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - GX_G1
        - GY_G1
        - GZ_G1
        - GT_G1
        - GX_GXY
        - GX_GZX
        - GX_GXT
        - GY_GXY
        - GY_GYZ
        - GY_GYT
        - GZ_GZX
        - GZ_GYZ
        - GZ_GZT
        - GT_GXT
        - GT_GYT
        - GT_GZT
        - GXY_G5T
        - GXY_G5Z
        - GYZ_G5T
        - GYZ_G5X
        - GZX_G5T
        - GZX_G5Y
        - GXT_G5Z
        - GXT_G5Y
        - GYT_G5Z
        - GYT_G5X
        - GZT_G5Y
        - GZT_G5X
        - G5X_G5
        - G5Y_G5
        - G5Z_G5
        - G5T_G5
      eig_range:
        min: 0
        max: 768
      outfile: contract
    all_local:
      gamma_label: all_local
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - G1_G1
        - GX_GX
        - GY_GY
        - GZ_GZ
        - GT_GT
        - GXY_GXY
        - GXT_GXT
        - GYZ_GYZ
        - GYT_GYT
        - GZX_GZX
        - GZT_GZT
        - G5T_G5T
        - G5X_G5X
        - G5Y_G5Y
        - G5Z_G5Z
        - G5_G5
      eig_range:
        min: 0
        max: 768
      outfile: contract
    pion_local:
      gamma_label: pion_local
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - "G5_G5"
      eig_range:
        min: 0
        max: 200
      outfile: contract
    vec_onelink:
      gamma_label: vec_onelink
      symmetric: True
      contraction_type: two_point
      mesons:
        file: "meson"
        mass: "l"
      gammas:
        - "GX_G1"
        - "GY_G1"
        - "GZ_G1"
      eig_range:
        min: 0
        max: 200
      outfile: contract

nanny:
  todo_file: todo
  # todo_file: todo_checkGhms
  max_queue: 200
  wait: 5
  check_interval: 30

submit:
  # scheduler: SLURM
  scheduler: INTERACTIVE
  job_name_pfx: LMI
  layout:
    ppn: 1 # Number of processes per node
    a2a_eig_local:
      nodes: 1
      geom: [1, 1, 1, 1]
    a2a_eig_onelink_1:
      nodes: 1
      geom: [1, 1, 1, 1]
    a2a_eig_onelink_2:
      nodes: 1
      geom: [1, 1, 1, 1]
    contract_g1g1:
      nodes: 1
      geom: [1, 1, 1, 1]
    eval:
      nodes: 1
      geom: [1, 1, 1, 1]
    contract:
      nodes: 1
      geom: [1, 1, 1, 1]


job_setup:
  contract_g1g1:
    run: contract.sh
    job_type: contract
    tasks:
      diagrams:
        - g1g1
    io: "contract-g1g1"
    wall_time: "8:00:00"
    params:
      eigs: 384
      ext: "-g1g1"
  contract:
    run: contract.sh
    job_type: contract
    tasks:
      diagrams:
        - test_tau
        #- all_local
        #- all_onelink
    io: "contract"
    wall_time: "8:00:00"
    params:
      eigs: 384
      dt: 1
      noise: 1
  eval:
    io: "eval-{eigs}"
    wall_time: "1:00:00"
    run: hadrons.sh
    job_type: hadrons
    task_type: lmi
    params:
      eigs: 384
    tasks:
      epack:
        load: true
        save_evals: true
  a2a_eig_local:
    io: "a2a-local-eig-{eigs}"
    wall_time: "1:00:00"
    run: hadrons.sh
    job_type: hadrons
    task_type: lmi
    params:
      eigs: 384
      blocksize: 384
    tasks:
      epack:
        load: true
        save_evals: false
      meson:
        gamma:
        - G1_G1
        - GX_GX
        - GY_GY
        - GZ_GZ
        - GT_GT
        - GXY_GXY
        - GXT_GXT
        - GYZ_GYZ
        - GYT_GYT
        - GZX_GZX
        - GZT_GZT
        - G5T_G5T
        - G5X_G5X
        - G5Y_G5Y
        - G5Z_G5Z
        - G5_G5
        mass:
        - 'l'
  a2a_eig_onelink_1:
    io: "a2a-onelink1-eig-{eigs}"
    wall_time: "1:00:00"
    run: hadrons.sh
    job_type: hadrons
    task_type: lmi
    params:
      eigs: 384
      blocksize: 384
    tasks:
      epack:
        load: true
        save_evals: false
      meson:
        gamma:
          - GX_G1
          - GY_G1
          - GZ_G1
          - GT_G1
          - GX_GXY
          - GX_GZX
          - GX_GXT
          - GY_GXY
          - GY_GYZ
          - GY_GYT
          - GZ_GZX
          - GZ_GYZ
          - GZ_GZT
          - GT_GXT
          - GT_GYT
          - GT_GZT
        mass:
        - 'l'
  a2a_eig_onelink_2:
    io: "a2a-onelink2-eig-{eigs}"
    wall_time: "1:00:00"
    run: hadrons.sh
    job_type: hadrons
    task_type: lmi
    params:
      eigs: 384
      blocksize: 384
    tasks:
      epack:
        load: true
        save_evals: false
      meson:
        gamma:
          - GXY_G5T
          - GXY_G5Z
          - GYZ_G5T
          - GYZ_G5X
          - GZX_G5T
          - GZX_G5Y
          - GXT_G5Z
          - GXT_G5Y
          - GYT_G5Z
          - GYT_G5X
          - GZT_G5Y
          - GZT_G5X
          - G5X_G5
          - G5Y_G5
          - G5Z_G5
          - G5T_G5
        mass:
        - 'l'
      


